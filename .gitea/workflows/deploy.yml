name: Deploy to Production

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Update code
        run: |
          sudo -u joe git -C /var/www/Joe-Web fetch origin
          sudo -u joe git -C /var/www/Joe-Web reset --hard origin/main

      - name: Run migrations
        run: |
          sudo -u joe /var/www/Joe-Web/venv/bin/python \
            /var/www/Joe-Web/manage.py migrate --noinput

      - name: Collect static files
        run: |
          sudo -u joe /var/www/Joe-Web/venv/bin/python \
            /var/www/Joe-Web/manage.py collectstatic --noinput

      - name: Restart Gunicorn
        run: |
          sudo systemctl restart joeweb